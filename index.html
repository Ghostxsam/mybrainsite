<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitVault Notes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background: #111; color: #eee; }
    input, textarea, button, select { background: #1e1e1e; color: #fff; border: 1px solid #333; padding: 8px 12px; border-radius: 6px; }
    textarea { width: 100%; height: 60vh; margin-top: 1rem; font-family: monospace; font-size: 15px; line-height: 1.5; box-sizing: border-box; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button { cursor: pointer; background: #2ea043; border: none; font-weight: 600; }
    button.secondary { background: #333; }
    #status { font-size: 0.85rem; color: #8b949e; margin-left: auto; }
  </style>
</head>
<body>

  <!-- Login Bar (Shows if no token saved in browser) -->
  <div id="auth-box" class="row" style="margin-bottom: 1rem;">
    <input id="owner" placeholder="GitHub Username" />
    <input id="repo" placeholder="Repo Name (e.g. my-notes-vault)" />
    <input id="token" type="password" placeholder="Fine-Grained PAT" />
    <button onclick="saveConfig()">Connect Vault</button>
  </div>

  <!-- Editor UI -->
  <div id="app" style="display:none;">
    <div class="row">
      <select id="file-list" onchange="loadNote(this.value)"></select>
      <button class="secondary" onclick="createNewNote()">+ New</button>
      <button onclick="saveNote()">Save (Ctrl+S)</button>
      <span id="status">Ready</span>
    </div>
    <textarea id="editor" placeholder="Write in Markdown..."></textarea>
  </div>

  <script>
    let cfg = JSON.parse(localStorage.getItem('gh_vault') || 'null');
    let currentSha = null;

    // UTF-8 safe Base64 helpers
    const toBase64 = str => btoa(unescape(encodeURIComponent(str)));
    const fromBase64 = b64 => decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));

    if (cfg) initApp();

    function saveConfig() {
      cfg = {
        owner: document.getElementById('owner').value.trim(),
        repo: document.getElementById('repo').value.trim(),
        token: document.getElementById('token').value.trim()
      };
      localStorage.setItem('gh_vault', JSON.stringify(cfg));
      initApp();
    }

    async function ghFetch(endpoint, options = {}) {
      const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/${endpoint}`, {
        ...options,
        headers: {
          'Authorization': `Bearer ${cfg.token}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json',
          ...(options.headers || {})
        }
      });
      if (!res.ok) throw new Error(`GitHub API ${res.status}`);
      return res.json();
    }

    async function initApp() {
      document.getElementById('auth-box').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      await refreshFileList();
    }

    async function refreshFileList() {
      setStatus('Syncing list...');
      const data = await ghFetch('git/trees/main?recursive=1');
      const mdFiles = data.tree.filter(f => f.type === 'blob' && f.path.endsWith('.md'));
      const select = document.getElementById('file-list');
      select.innerHTML = mdFiles.map(f => `<option value="${f.path}">${f.path}</option>`).join('');
      if (mdFiles.length) loadNote(mdFiles[0].path);
    }

    async function loadNote(path) {
      setStatus('Loading...');
      const data = await ghFetch(`contents/${path}?t=${Date.now()}`); // bypass cache
      currentSha = data.sha;
      document.getElementById('editor').value = fromBase64(data.content);
      setStatus(`Loaded ${path}`);
    }

    async function saveNote() {
      const path = document.getElementById('file-list').value;
      const content = document.getElementById('editor').value;
      setStatus('Saving to GitHub...');
      try {
        const res = await ghFetch(`contents/${path}`, {
          method: 'PUT',
          body: JSON.stringify({
            message: `Update ${path}`,
            content: toBase64(content),
            sha: currentSha
          })
        });
        currentSha = res.content.sha;
        setStatus('Saved ✓');
      } catch (e) {
        setStatus('Conflict or error! Reload note.');
      }
    }

    async function createNewNote() {
      const name = prompt('File path (e.g. ideas/project.md):');
      if (!name) return;
      const path = name.endsWith('.md') ? name : `${name}.md`;
      await ghFetch(`contents/${path}`, {
        method: 'PUT',
        body: JSON.stringify({ message: `Create ${path}`, content: toBase64(`# ${path}\n`) })
      });
      await refreshFileList();
      document.getElementById('file-list').value = path;
      await loadNote(path);
    }

    function setStatus(msg) { document.getElementById('status').textContent = msg; }

    // Ctrl+S shortcut
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveNote(); }
    });
  </script>
</body>
</html>
