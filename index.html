<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozy Planner & Vault</title>
  <style>
    :root {
      --bg: #171513;
      --surface: #211e1b;
      --surface-2: #2b2723;
      --text: #f3ede4;
      --muted: #b3a89a;
      --accent: #e09f7d;       /* warm terracotta */
      --accent-soft: rgba(224, 159, 125, 0.16);
      --sage: #9ec1a3;         /* cozy sage */
      --warn: #e5b567;
      --urgent: #e07a7a;
      --border: rgba(243, 237, 228, 0.09);
      --radius: 20px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 18px 14px 64px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    /* Top Cozy Header */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Cozy Android Pill Tabs */
    .tabs {
      display: inline-flex;
      background: var(--surface);
      padding: 5px;
      border-radius: 999px;
      border: 1px solid var(--border);
      gap: 4px;
      margin-bottom: 18px;
    }

    .tab-btn {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #1b1512;
    }

    /* Cards & Inputs */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
    }

    .card-title {
      margin: 0 0 12px;
      font-size: 1rem;
      font-weight: 650;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    input, select, textarea, button {
      font-family: inherit;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 0.92rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.08s ease, opacity 0.15s ease;
    }

    button:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--accent);
      color: #191411;
      border: none;
    }

    .btn-ghost {
      background: var(--surface-2);
      color: var(--text);
    }

    .btn-sm {
      padding: 6px 11px;
      font-size: 0.8rem;
      border-radius: 999px;
    }

    .grid-form {
      display: grid;
      grid-template-columns: 2fr 1.2fr 1.2fr auto;
      gap: 10px;
      align-items: center;
    }

    @media (max-width: 720px) {
      .grid-form { grid-template-columns: 1fr; }
    }

    /* Task Rows (Android Cozy List) */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .check-btn {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border-radius: 999px;
      border: 2px solid var(--accent);
      background: transparent;
      display: grid;
      place-items: center;
      padding: 0;
      color: #191411;
      font-size: 0.8rem;
    }

    .check-btn.done {
      background: var(--sage);
      border-color: var(--sage);
    }

    .task-title {
      font-weight: 600;
      font-size: 0.96rem;
      word-break: break-word;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
      align-items: center;
    }

    .pill {
      font-size: 0.74rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
    }

    .pill.cat {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .pill.days-ok { color: var(--sage); background: rgba(158, 193, 163, 0.14); }
    .pill.days-soon { color: var(--warn); background: rgba(229, 181, 103, 0.15); }
    .pill.days-late { color: var(--urgent); background: rgba(224, 122, 122, 0.16); }

    .del-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 6px 8px;
      font-size: 0.85rem;
    }
    .del-btn:hover { color: var(--urgent); }

    /* Calendar Grid */
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .cal-dow {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 600;
      padding: 4px 0;
    }

    .cal-day {
      min-height: 74px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 7px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.15s ease;
    }

    .cal-day.empty {
      background: transparent;
      border-color: transparent;
      cursor: default;
    }

    .cal-day.today {
      border-color: var(--accent);
    }

    .cal-day.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .cal-num {
      font-size: 0.82rem;
      font-weight: 650;
    }

    .cal-dots {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .dot.done { background: var(--sage); }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 24px 12px;
      font-size: 0.9rem;
    }

    .auth-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .auth-row input { flex: 1 1 160px; }

    textarea.md-area {
      width: 100%;
      min-height: 300px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      line-height: 1.6;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <h1>Cozy Brain</h1>
        <p id="status-text">Ready</p>
      </div>
      <div class="top-actions">
        <button class="btn-ghost btn-sm" onclick="syncTasksFromGitHub(true)">Sync</button>
        <button class="btn-ghost btn-sm" onclick="logout()">Key / Repo</button>
      </div>
    </div>

    <!-- Login Box -->
    <div id="auth-card" class="card" style="display:none;">
      <div class="card-title">Connect GitHub Vault</div>
      <div class="auth-row">
        <input id="gh-owner" placeholder="Username (e.g. Ghostxsam)" />
        <input id="gh-repo" placeholder="Repo (e.g. mybrain)" />
        <input id="gh-branch" value="main" placeholder="Branch" style="max-width:110px;" />
        <input id="gh-token" type="password" placeholder="Personal Access Token" />
        <button class="btn-primary" onclick="saveConfig()">Connect</button>
      </div>
    </div>

    <!-- Main Navigation -->
    <div id="main-shell" style="display:none;">
      <div class="tabs">
        <button id="tab-left" class="tab-btn active" onclick="switchTab('left')">What's Left</button>
        <button id="tab-cal" class="tab-btn" onclick="switchTab('cal')">Calendar</button>
        <button id="tab-notes" class="tab-btn" onclick="switchTab('notes')">Notes</button>
      </div>

      <!-- TAB 1: WHAT'S LEFT (MAIN TAB) -->
      <section id="view-left">
        <div class="card">
          <div class="card-title">Add Work</div>
          <form class="grid-form" onsubmit="addTask(event)">
            <input id="task-title" placeholder="What needs to be done?" required />
            <input id="task-category" list="cat-suggestions" placeholder="Category (e.g. Study, Design, Life)" />
            <datalist id="cat-suggestions">
              <option value="Study"></option>
              <option value="Project"></option>
              <option value="Design"></option>
              <option value="Personal"></option>
              <option value="Errands"></option>
            </datalist>
            <input id="task-date" type="date" required />
            <button type="submit" class="btn-primary">Add</button>
          </form>
        </div>

        <div class="card">
          <div class="card-title">
            <span>Remaining Work</span>
            <span id="remaining-count" class="pill">0 left</span>
          </div>
          <div id="remaining-list" class="task-list"></div>
        </div>

        <div class="card">
          <div class="card-title">
            <span>Completed</span>
            <button class="btn-ghost btn-sm" onclick="clearCompleted()">Clear done</button>
          </div>
          <div id="completed-list" class="task-list"></div>
        </div>
      </section>

      <!-- TAB 2: CALENDAR -->
      <section id="view-cal" style="display:none;">
        <div class="card">
          <div class="cal-header">
            <button class="btn-ghost btn-sm" onclick="changeMonth(-1)">←</button>
            <strong id="cal-month-label"></strong>
            <button class="btn-ghost btn-sm" onclick="changeMonth(1)">→</button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>

        <div class="card">
          <div class="card-title">
            <span id="selected-day-title">Selected Day</span>
            <span id="selected-day-countdown" class="pill"></span>
          </div>
          <form class="grid-form" style="margin-bottom:14px;" onsubmit="addTaskFromCal(event)">
            <input id="cal-task-title" placeholder="Add work for this day..." required />
            <input id="cal-task-cat" list="cat-suggestions" placeholder="Category" />
            <button type="submit" class="btn-primary">Add to Day</button>
          </form>
          <div id="cal-day-tasks" class="task-list"></div>
        </div>
      </section>

      <!-- TAB 3: MARKDOWN NOTES -->
      <section id="view-notes" style="display:none;">
        <div class="card">
          <div class="card-title">
            <span>Markdown Notes</span>
            <div class="top-actions">
              <select id="note-select" onchange="loadNote(this.value)"></select>
              <button class="btn-ghost btn-sm" onclick="createNote()">+ New</button>
              <button class="btn-primary btn-sm" onclick="saveNote()">Save</button>
            </div>
          </div>
          <textarea id="note-editor" class="md-area" placeholder="Write markdown notes..."></textarea>
        </div>
      </section>
    </div>
  </div>

  <script>
    const TASKS_FILE = 'tasks.json';
    const CACHE_KEY = 'cozy_tasks_cache_v1';

    let cfg = JSON.parse(localStorage.getItem('gh_vault') || 'null');
    let tasks = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]');
    let tasksSha = null;

    let calYear, calMonth;
    let selectedDateStr = todayISO();
    let currentNoteSha = null;

    function todayISO() {
      const d = new Date();
      const off = d.getTimezoneOffset();
      const local = new Date(d.getTime() - off * 60000);
      return local.toISOString().slice(0, 10);
    }

    function daysLeft(dateStr) {
      if (!dateStr) return null;
      const [y, m, day] = dateStr.split('-').map(Number);
      const target = new Date(y, m - 1, day);
      const now = new Date();
      const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((target - startToday) / 86400000);
    }

    function formatDaysPill(dateStr, done) {
      if (done) return `<span class="pill days-ok">Done</span>`;
      const diff = daysLeft(dateStr);
      if (diff === null) return '';
      if (diff < 0) return `<span class="pill days-late">${Math.abs(diff)}d overdue</span>`;
      if (diff === 0) return `<span class="pill days-soon">Due today</span>`;
      if (diff === 1) return `<span class="pill days-soon">1 day left</span>`;
      const cls = diff <= 3 ? 'days-soon' : 'days-ok';
      return `<span class="pill ${cls}">${diff} days left</span>`;
    }

    function setStatus(msg) {
      document.getElementById('status-text').textContent = msg;
    }

    const toBase64 = str => btoa(unescape(encodeURIComponent(str)));
    const fromBase64 = b64 => decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));

    function saveConfig() {
      cfg = {
        owner: document.getElementById('gh-owner').value.trim(),
        repo: document.getElementById('gh-repo').value.trim(),
        branch: (document.getElementById('gh-branch').value || 'main').trim(),
        token: document.getElementById('gh-token').value.trim()
      };
      if (!cfg.owner || !cfg.repo || !cfg.token) return alert('Fill in username, repo, and token.');
      localStorage.setItem('gh_vault', JSON.stringify(cfg));
      startApp();
    }

    function logout() {
      localStorage.removeItem('gh_vault');
      cfg = null;
      document.getElementById('main-shell').style.display = 'none';
      document.getElementById('auth-card').style.display = 'block';
    }

    async function ghFetch(endpoint, options = {}) {
      const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/${endpoint}`, {
        ...options,
        headers: {
          'Authorization': `Bearer ${cfg.token}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json',
          ...(options.headers || {})
        }
      });
      if (res.status === 404 && options.allow404) return null;
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${data.message || 'Error'}`);
      return data;
    }

    async function startApp() {
      document.getElementById('auth-card').style.display = 'none';
      document.getElementById('main-shell').style.display = 'block';
      document.getElementById('task-date').value = todayISO();

      const now = new Date();
      calYear = now.getFullYear();
      calMonth = now.getMonth();

      renderAll();
      await syncTasksFromGitHub(false);
    }

    async function syncTasksFromGitHub(showMsg = true) {
      if (!cfg) return;
      if (showMsg) setStatus('Syncing tasks...');
      try {
        const file = await ghFetch(`contents/${TASKS_FILE}?ref=${cfg.branch}&t=${Date.now()}`, { allow404: true });
        if (file) {
          tasksSha = file.sha;
          tasks = JSON.parse(fromBase64(file.content) || '[]');
          localStorage.setItem(CACHE_KEY, JSON.stringify(tasks));
          renderAll();
        }
        setStatus('Synced ✓');
      } catch (e) {
        setStatus(`Sync error: ${e.message}`);
      }
    }

    async function pushTasksToGitHub() {
      localStorage.setItem(CACHE_KEY, JSON.stringify(tasks));
      renderAll();
      if (!cfg) return;
      setStatus('Saving to vault...');
      try {
        // Fetch fresh sha if unknown to avoid 409/422 conflicts
        if (!tasksSha) {
          const existing = await ghFetch(`contents/${TASKS_FILE}?ref=${cfg.branch}&t=${Date.now()}`, { allow404: true });
          if (existing) tasksSha = existing.sha;
        }
        const body = {
          message: 'Update tasks.json',
          content: toBase64(JSON.stringify(tasks, null, 2)),
          branch: cfg.branch
        };
        if (tasksSha) body.sha = tasksSha;

        const res = await ghFetch(`contents/${TASKS_FILE}`, {
          method: 'PUT',
          body: JSON.stringify(body)
        });
        tasksSha = res.content.sha;
        setStatus('Saved ✓');
      } catch (e) {
        // Retry once after refreshing sha
        tasksSha = null;
        setStatus(`Save issue: ${e.message}`);
      }
    }

    function addTask(e) {
      e.preventDefault();
      const title = document.getElementById('task-title').value.trim();
      const category = (document.getElementById('task-category').value || 'General').trim();
      const dueDate = document.getElementById('task-date').value || todayISO();
      if (!title) return;

      tasks.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        title,
        category,
        dueDate,
        done: false
      });
      document.getElementById('task-title').value = '';
      pushTasksToGitHub();
    }

    function addTaskFromCal(e) {
      e.preventDefault();
      const title = document.getElementById('cal-task-title').value.trim();
      const category = (document.getElementById('cal-task-cat').value || 'General').trim();
      if (!title) return;

      tasks.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        title,
        category,
        dueDate: selectedDateStr,
        done: false
      });
      document.getElementById('cal-task-title').value = '';
      pushTasksToGitHub();
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
      pushTasksToGitHub();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      pushTasksToGitHub();
    }

    function clearCompleted() {
      tasks = tasks.filter(t => !t.done);
      pushTasksToGitHub();
    }

    function renderTaskItem(t) {
      return `
        <div class="task-item ${t.done ? 'completed' : ''}">
          <div class="task-left">
            <button class="check-btn ${t.done ? 'done' : ''}" onclick="toggleTask('${t.id}')" title="Toggle complete">
              ${t.done ? '✓' : ''}
            </button>
            <div>
              <div class="task-title">${escapeHtml(t.title)}</div>
              <div class="task-meta">
                <span class="pill cat">${escapeHtml(t.category || 'General')}</span>
                <span class="pill">${t.dueDate || ''}</span>
                ${formatDaysPill(t.dueDate, t.done)}
              </div>
            </div>
          </div>
          <button class="del-btn" onclick="deleteTask('${t.id}')" title="Delete">✕</button>
        </div>
      `;
    }

    function renderAll() {
      const remaining = tasks
        .filter(t => !t.done)
        .sort((a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999'));

      const completed = tasks.filter(t => t.done);

      document.getElementById('remaining-count').textContent = `${remaining.length} left`;
      document.getElementById('remaining-list').innerHTML = remaining.length
        ? remaining.map(renderTaskItem).join('')
        : `<div class="empty-state">All caught up. Enjoy the calm.</div>`;

      document.getElementById('completed-list').innerHTML = completed.length
        ? completed.map(renderTaskItem).join('')
        : `<div class="empty-state">No completed tasks yet.</div>`;

      renderCalendar();
    }

    function switchTab(tab) {
      ['left', 'cal', 'notes'].forEach(name => {
        document.getElementById(`view-${name}`).style.display = name === tab ? 'block' : 'none';
        document.getElementById(`tab-${name}`).classList.toggle('active', name === tab);
      });
      if (tab === 'notes') loadNotesList();
    }

    function changeMonth(delta) {
      calMonth += delta;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendar();
    }

    function renderCalendar() {
      const grid = document.getElementById('cal-grid');
      if (!grid) return;

      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      document.getElementById('cal-month-label').textContent = `${monthNames[calMonth]} ${calYear}`;

      const firstDay = new Date(calYear, calMonth, 1).getDay();
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

      let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');
      for (let i = 0; i < firstDay; i++) {
        html += `<div class="cal-day empty"></div>`;
      }

      const today = todayISO();
      for (let day = 1; day <= daysInMonth; day++) {
        const mm = String(calMonth + 1).padStart(2, '0');
        const dd = String(day).padStart(2, '0');
        const iso = `${calYear}-${mm}-${dd}`;
        const dayTasks = tasks.filter(t => t.dueDate === iso);

        const dots = dayTasks.slice(0, 6).map(t =>
          `<span class="dot ${t.done ? 'done' : ''}"></span>`
        ).join('');

        html += `
          <div class="cal-day ${iso === today ? 'today' : ''} ${iso === selectedDateStr ? 'selected' : ''}" onclick="selectDay('${iso}')">
            <div class="cal-num">${day}</div>
            <div class="cal-dots">${dots}</div>
          </div>
        `;
      }

      grid.innerHTML = html;
      renderSelectedDay();
    }

    function selectDay(iso) {
      selectedDateStr = iso;
      renderCalendar();
    }

    function renderSelectedDay() {
      document.getElementById('selected-day-title').textContent = `Work on ${selectedDateStr}`;
      const diff = daysLeft(selectedDateStr);
      const pill = document.getElementById('selected-day-countdown');
      if (diff === 0) pill.textContent = 'Today';
      else if (diff > 0) pill.textContent = `${diff} days from today`;
      else pill.textContent = `${Math.abs(diff)} days ago`;

      const dayTasks = tasks.filter(t => t.dueDate === selectedDateStr);
      document.getElementById('cal-day-tasks').innerHTML = dayTasks.length
        ? dayTasks.map(renderTaskItem).join('')
        : `<div class="empty-state">Nothing scheduled for this day.</div>`;
    }

    // Notes helpers (keeps your Markdown vault accessible)
    async function loadNotesList() {
      try {
        setStatus('Loading notes...');
        const tree = await ghFetch(`git/trees/${cfg.branch}?recursive=1`);
        const mdFiles = (tree.tree || []).filter(f => f.type === 'blob' && f.path.endsWith('.md') && f.path !== TASKS_FILE);
        const sel = document.getElementById('note-select');
        sel.innerHTML = mdFiles.map(f => `<option value="${f.path}">${f.path}</option>`).join('');
        if (mdFiles.length) await loadNote(mdFiles[0].path);
        setStatus('Ready');
      } catch (e) {
        setStatus(`Notes error: ${e.message}`);
      }
    }

    async function loadNote(path) {
      if (!path) return;
      const data = await ghFetch(`contents/${path}?ref=${cfg.branch}&t=${Date.now()}`);
      currentNoteSha = data.sha;
      document.getElementById('note-editor').value = fromBase64(data.content);
    }

    async function saveNote() {
      const path = document.getElementById('note-select').value;
      if (!path) return;
      const content = document.getElementById('note-editor').value;
      const res = await ghFetch(`contents/${path}`, {
        method: 'PUT',
        body: JSON.stringify({
          message: `Update ${path}`,
          content: toBase64(content),
          sha: currentNoteSha,
          branch: cfg.branch
        })
      });
      currentNoteSha = res.content.sha;
      setStatus(`Saved ${path} ✓`);
    }

    async function createNote() {
      const name = prompt('Note filename (e.g. ideas.md):');
      if (!name) return;
      const path = name.trim().endsWith('.md') ? name.trim() : `${name.trim()}.md`;
      await ghFetch(`contents/${path}`, {
        method: 'PUT',
        body: JSON.stringify({ message: `Create ${path}`, content: toBase64(`# ${name}\n`), branch: cfg.branch })
      });
      await loadNotesList();
      document.getElementById('note-select').value = path;
      await loadNote(path);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    if (cfg) {
      startApp();
    } else {
      document.getElementById('auth-card').style.display = 'block';
    }
  </script>
</body>
</html>
