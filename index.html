<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozy Brain — Dashboard, Calendar & Notes</title>
  <style>
    
    /* 1. Dark Mode (Pitch/Charcoal + Lavender/Mango/Pink vibe) */
:root {
  --bg: #0c0c0e;
  --surface: #17171b;
  --surface-2: #222228;
  --surface-3: #2d2d35;
  --text: #ffffff;
  --muted: #b6b4c2;
  --accent: #c8b6ff;          /* soft lilac */
  --accent-contrast: #12101c;
  --accent-soft: rgba(200, 182, 255, 0.18);
  --sage: #ffb84d;            /* warm mango/amber */
  --warn: #9db4ff;            /* periwinkle blue */
  --urgent: #ff77b7;          /* bubble pink */
  --border: rgba(255, 255, 255, 0.12);
}

/* 2. Light Mode (Crisp White + Soft Lilac/Mango/Periwinkle/Pink) */
body.light {
  --bg: #ffffff;
  --surface: #f7f5fc;
  --surface-2: #efeaf9;
  --surface-3: #e3dcf4;
  --text: #111111;
  --muted: #5e5a6e;
  --accent-contrast: #111111;
  --border: rgba(17, 17, 17, 0.1);
}

/* 3. New Move/Sync Palettes (swap or add inside body[data-palette="..."]) */
body[data-palette="lilac"] {
  --accent: #c8b6ff;
  --accent-soft: rgba(200, 182, 255, 0.22);
}
body.light[data-palette="lilac"] {
  --accent: #b8a3ff;
  --accent-soft: rgba(184, 163, 255, 0.25);
}

body[data-palette="mango"] {
  --accent: #ffb84d;
  --accent-soft: rgba(255, 184, 77, 0.22);
}
body.light[data-palette="mango"] {
  --accent: #ffb347;
  --accent-soft: rgba(255, 179, 71, 0.25);
}

body[data-palette="periwinkle"] {
  --accent: #9db4ff;
  --accent-soft: rgba(157, 180, 255, 0.22);
}
body.light[data-palette="periwinkle"] {
  --accent: #8fa8ff;
  --accent-soft: rgba(143, 168, 255, 0.24);
}

body[data-palette="bubblegum"] {
  --accent: #ff77b7;
  --accent-soft: rgba(255, 119, 183, 0.22);
}
body.light[data-palette="bubblegum"] {
  --accent: #ff6eb4;
  --accent-soft: rgba(255, 110, 180, 0.22);
}

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px 24px 72px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    @media (max-width: 640px) {
      body { padding: 14px 12px 64px; }
    }

    .container {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .tabs {
      display: inline-flex;
      background: var(--surface);
      padding: 5px;
      border-radius: 999px;
      border: 1px solid var(--border);
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 650;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: var(--accent-contrast);
    }

    .palette-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid transparent;
      padding: 0;
      cursor: pointer;
    }
    .swatch.active { border-color: var(--text); transform: scale(1.12); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      margin: 0 0 14px;
      font-size: 1.02rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    input, select, textarea, button {
      font-family: inherit;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 13px;
      font-size: 0.92rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.08s ease, opacity 0.15s ease, background 0.15s ease;
    }

    button:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-contrast);
      border: none;
    }

    .btn-ghost {
      background: var(--surface-2);
      color: var(--text);
    }

    .btn-danger {
      background: rgba(224, 122, 122, 0.16);
      color: var(--urgent);
      border: 1px solid rgba(224, 122, 122, 0.28);
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 0.82rem;
      border-radius: 999px;
    }

    /* Dashboard Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    @media (max-width: 680px) {
      .stats-grid { grid-template-columns: 1fr; }
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }

    .stat-label {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat-val {
      font-size: 1.65rem;
      font-weight: 750;
      margin-top: 4px;
    }

    .dash-split {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 960px) {
      .dash-split { grid-template-columns: 1fr; }
    }

    .grid-form {
      display: grid;
      grid-template-columns: 2fr 1.1fr 1.1fr auto;
      gap: 10px;
      align-items: center;
    }

    @media (max-width: 720px) {
      .grid-form { grid-template-columns: 1fr; }
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .check-btn {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border-radius: 999px;
      border: 2px solid var(--accent);
      background: transparent;
      display: grid;
      place-items: center;
      padding: 0;
      color: var(--accent-contrast);
      font-size: 0.8rem;
    }

    .check-btn.done {
      background: var(--sage);
      border-color: var(--sage);
    }

    .task-title {
      font-weight: 600;
      font-size: 0.96rem;
      word-break: break-word;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 5px;
      align-items: center;
    }

    .pill {
      font-size: 0.74rem;
      font-weight: 650;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--surface-3);
      color: var(--muted);
    }

    .pill.cat {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .pill.days-ok { color: var(--sage); background: rgba(158, 193, 163, 0.16); }
    .pill.days-soon { color: var(--warn); background: rgba(229, 181, 103, 0.18); }
    .pill.days-late { color: var(--urgent); background: rgba(224, 122, 122, 0.18); }

    .del-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 6px 8px;
      font-size: 0.85rem;
    }
    .del-btn:hover { color: var(--urgent); }

    /* Calendar Grid */
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
    }

    .cal-dow {
      text-align: center;
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 650;
      padding: 4px 0;
    }

    .cal-day {
      min-height: 108px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .cal-day.empty {
      background: transparent;
      border-color: transparent;
      cursor: default;
      min-height: 54px;
    }

    .cal-day.today { border-color: var(--accent); }
    .cal-day.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .cal-num {
      font-size: 0.84rem;
      font-weight: 700;
    }

    .cal-chips {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
      min-width: 0;
    }

    .cal-chip {
      font-size: 0.72rem;
      line-height: 1.25;
      padding: 3px 6px;
      border-radius: 7px;
      background: var(--accent-soft);
      color: var(--text);
      border-left: 2.5px solid var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cal-chip.done {
      opacity: 0.55;
      text-decoration: line-through;
      background: rgba(158, 193, 163, 0.14);
      border-left-color: var(--sage);
      color: var(--muted);
    }

    .cal-more {
      font-size: 0.68rem;
      color: var(--muted);
      font-weight: 600;
      padding-left: 3px;
    }

    @media (max-width: 640px) {
      .cal-grid { gap: 4px; }
      .cal-day { min-height: 78px; padding: 5px; border-radius: 10px; }
      .cal-chip { font-size: 0.62rem; padding: 2px 4px; }
    }

    /* Google Keep Style Notes Grid & Editor */
    .notes-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
    }

    .keep-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease;
    }

    .keep-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .keep-title {
      font-weight: 700;
      font-size: 1rem;
      margin: 0 0 8px;
      word-break: break-word;
    }

    .keep-preview {
      font-size: 0.85rem;
      color: var(--muted);
      white-space: pre-line;
      max-height: 150px;
      overflow: hidden;
    }

    .keep-checklist-item {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 4px;
      font-size: 0.84rem;
    }

    .keep-checklist-item.checked {
      text-decoration: line-through;
      opacity: 0.65;
    }

    .keep-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .checklist-editor-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .check-row label {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      cursor: pointer;
      font-size: 0.92rem;
    }

    .check-row input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .check-row .done-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    textarea.md-area {
      width: 100%;
      min-height: 280px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      line-height: 1.6;
      margin-top: 12px;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 24px 12px;
      font-size: 0.9rem;
    }

    .auth-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .auth-row input { flex: 1 1 160px; }
  </style>
</head>
<body data-palette="terracotta">
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <h1>Cozy Brain</h1>
        <p id="status-text">Ready</p>
      </div>
      <div class="top-actions">
        <button class="btn-ghost btn-sm" id="mode-btn" onclick="toggleDarkLight()">☀️ Light</button>
        <button class="btn-ghost btn-sm" onclick="syncAll(true)">Sync</button>
        <button class="btn-ghost btn-sm" onclick="logout()">Key / Repo</button>
      </div>
    </div>

    <div id="auth-card" class="card" style="display:none;">
      <div class="card-title">Connect GitHub Vault</div>
      <div class="auth-row">
        <input id="gh-owner" placeholder="Username (e.g. Ghostxsam)" />
        <input id="gh-repo" placeholder="Repo (e.g. mybrain)" />
        <input id="gh-branch" value="main" placeholder="Branch" style="max-width:110px;" />
        <input id="gh-token" type="password" placeholder="Personal Access Token" />
        <button class="btn-primary" onclick="saveConfig()">Connect</button>
      </div>
    </div>

    <div id="main-shell" style="display:none;">
      <div class="nav-bar">
        <div class="tabs">
          <button id="tab-dash" class="tab-btn active" onclick="switchTab('dash')">Dashboard</button>
          <button id="tab-cal" class="tab-btn" onclick="switchTab('cal')">Calendar</button>
          <button id="tab-notes" class="tab-btn" onclick="switchTab('notes')">Notes</button>
        </div>

        <div class="palette-row" title="Cozy accent color">
          <span class="pill" style="background:transparent; padding:0 4px 0 0;">Color</span>
          <button class="swatch active" data-p="terracotta" style="background:#e09f7d;" onclick="setPalette('terracotta')"></button>
          <button class="swatch" data-p="sage" style="background:#8fbc94;" onclick="setPalette('sage')"></button>
          <button class="swatch" data-p="latte" style="background:#dfb679;" onclick="setPalette('latte')"></button>
          <button class="swatch" data-p="sky" style="background:#8cb8d9;" onclick="setPalette('sky')"></button>
        </div>
      </div>

      <!-- TAB 1: DASHBOARD -->
      <section id="view-dash">
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-label">Work Left</div>
            <div class="stat-val" id="stat-left">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Due Today / ≤3 Days</div>
            <div class="stat-val" id="stat-soon">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Completed</div>
            <div class="stat-val" id="stat-done">0</div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Add Work</div>
          <form class="grid-form" onsubmit="addTask(event)">
            <input id="task-title" placeholder="What needs to be done?" required />
            <input id="task-category" list="cat-suggestions" placeholder="Category (e.g. Exam, Study, Project)" />
            <datalist id="cat-suggestions">
              <option value="Exam"></option>
              <option value="Study"></option>
              <option value="Project"></option>
              <option value="Design"></option>
              <option value="Personal"></option>
            </datalist>
            <input id="task-date" type="date" required />
            <button type="submit" class="btn-primary">Add</button>
          </form>
        </div>

        <div class="dash-split">
          <div class="card">
            <div class="card-title">
              <span>Remaining Work</span>
              <span id="remaining-count" class="pill">0 left</span>
            </div>
            <div id="remaining-list" class="task-list"></div>
          </div>

          <div class="card">
            <div class="card-title">
              <span>Completed</span>
              <button class="btn-ghost btn-sm" onclick="clearCompleted()">Clear done</button>
            </div>
            <div id="completed-list" class="task-list"></div>
          </div>
        </div>
      </section>

      <!-- TAB 2: CALENDAR -->
      <section id="view-cal" style="display:none;">
        <div class="card">
          <div class="cal-header">
            <button class="btn-ghost btn-sm" onclick="changeMonth(-1)">←</button>
            <strong id="cal-month-label"></strong>
            <button class="btn-ghost btn-sm" onclick="changeMonth(1)">→</button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>

        <div class="card">
          <div class="card-title">
            <span id="selected-day-title">Selected Day</span>
            <span id="selected-day-countdown" class="pill"></span>
          </div>
          <form class="grid-form" style="margin-bottom:14px;" onsubmit="addTaskFromCal(event)">
            <input id="cal-task-title" placeholder="Add work for this day..." required />
            <input id="cal-task-cat" list="cat-suggestions" placeholder="Category" />
            <button type="submit" class="btn-primary">Add to Day</button>
          </form>
          <div id="cal-day-tasks" class="task-list"></div>
        </div>
      </section>

      <!-- TAB 3: GOOGLE KEEP STYLE NOTES -->
      <section id="view-notes" style="display:none;">
        <div id="notes-list-view" class="card">
          <div class="notes-toolbar">
            <div class="card-title" style="margin:0;">My Notes</div>
            <div class="top-actions">
              <input id="note-search" placeholder="Search notes..." oninput="renderNotesGrid()" style="min-width:190px;" />
              <button class="btn-primary btn-sm" onclick="createNewNoteFlow()">+ New Note</button>
            </div>
          </div>
          <div id="notes-grid" class="notes-grid"></div>
        </div>

        <div id="note-detail-view" class="card" style="display:none;">
          <div class="card-title">
            <div class="top-actions">
              <button class="btn-ghost btn-sm" onclick="backToNotesList()">← All Notes</button>
              <strong id="active-note-name"></strong>
            </div>
            <div class="top-actions">
              <button class="btn-ghost btn-sm" onclick="addCheckboxToNote()">☑ Add Checkbox</button>
              <button class="btn-danger btn-sm" onclick="deleteCurrentNote()">Delete</button>
              <button class="btn-primary btn-sm" onclick="saveCurrentNote()">Save</button>
            </div>
          </div>

          <div id="note-checklist-panel" class="checklist-editor-box" style="display:none;"></div>

          <textarea id="note-editor" class="md-area" placeholder="Write note text or use '- [ ] item' for checkboxes..." oninput="renderNoteChecklist()"></textarea>
        </div>
      </section>
    </div>
  </div>

  <script>
    const TASKS_FILE = 'tasks.json';
    const TASKS_CACHE = 'cozy_tasks_cache_v1';
    const NOTES_CACHE = 'cozy_notes_cache_v1';
    const THEME_KEY = 'cozy_theme_v1';

    let cfg = JSON.parse(localStorage.getItem('gh_vault') || 'null');
    let tasks = JSON.parse(localStorage.getItem(TASKS_CACHE) || '[]');
    let notesStore = JSON.parse(localStorage.getItem(NOTES_CACHE) || '{}'); // { [path]: { content, sha } }
    let tasksSha = null;

    let calYear, calMonth;
    let selectedDateStr = todayISO();
    let activeNotePath = null;

    function initTheme() {
      const saved = JSON.parse(localStorage.getItem(THEME_KEY) || '{"light":false,"palette":"terracotta"}');
      applyTheme(saved.light, saved.palette);
    }

    function applyTheme(isLight, palette) {
      document.body.classList.toggle('light', !!isLight);
      document.body.setAttribute('data-palette', palette || 'terracotta');
      document.getElementById('mode-btn').textContent = isLight ? '🌙 Dark' : '☀️ Light';
      document.querySelectorAll('.swatch').forEach(s => {
        s.classList.toggle('active', s.dataset.p === palette);
      });
      localStorage.setItem(THEME_KEY, JSON.stringify({ light: !!isLight, palette }));
    }

    function toggleDarkLight() {
      const current = JSON.parse(localStorage.getItem(THEME_KEY) || '{"light":false,"palette":"terracotta"}');
      applyTheme(!current.light, current.palette);
    }

    function setPalette(palette) {
      const current = JSON.parse(localStorage.getItem(THEME_KEY) || '{"light":false,"palette":"terracotta"}');
      applyTheme(current.light, palette);
    }

    function todayISO() {
      const d = new Date();
      const off = d.getTimezoneOffset();
      const local = new Date(d.getTime() - off * 60000);
      return local.toISOString().slice(0, 10);
    }

    function daysLeft(dateStr) {
      if (!dateStr) return null;
      const [y, m, day] = dateStr.split('-').map(Number);
      const target = new Date(y, m - 1, day);
      const now = new Date();
      const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((target - startToday) / 86400000);
    }

    function formatDaysPill(dateStr, done) {
      if (done) return `<span class="pill days-ok">Done</span>`;
      const diff = daysLeft(dateStr);
      if (diff === null) return '';
      if (diff < 0) return `<span class="pill days-late">${Math.abs(diff)}d overdue</span>`;
      if (diff === 0) return `<span class="pill days-soon">Due today</span>`;
      if (diff === 1) return `<span class="pill days-soon">1 day left</span>`;
      const cls = diff <= 3 ? 'days-soon' : 'days-ok';
      return `<span class="pill ${cls}">${diff} days left</span>`;
    }

    function setStatus(msg) {
      document.getElementById('status-text').textContent = msg;
    }

    const toBase64 = str => btoa(unescape(encodeURIComponent(str)));
    const fromBase64 = b64 => decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));

    function saveConfig() {
      cfg = {
        owner: document.getElementById('gh-owner').value.trim(),
        repo: document.getElementById('gh-repo').value.trim(),
        branch: (document.getElementById('gh-branch').value || 'main').trim(),
        token: document.getElementById('gh-token').value.trim()
      };
      if (!cfg.owner || !cfg.repo || !cfg.token) return alert('Fill in username, repo, and token.');
      localStorage.setItem('gh_vault', JSON.stringify(cfg));
      startApp();
    }

    function logout() {
      localStorage.removeItem('gh_vault');
      cfg = null;
      document.getElementById('main-shell').style.display = 'none';
      document.getElementById('auth-card').style.display = 'block';
    }

    async function ghFetch(endpoint, options = {}) {
      const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/${endpoint}`, {
        ...options,
        headers: {
          'Authorization': `Bearer ${cfg.token}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json',
          ...(options.headers || {})
        }
      });
      if (res.status === 404 && options.allow404) return null;
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${data.message || 'Error'}`);
      return data;
    }

    async function startApp() {
      document.getElementById('auth-card').style.display = 'none';
      document.getElementById('main-shell').style.display = 'block';
      document.getElementById('task-date').value = todayISO();

      const now = new Date();
      calYear = now.getFullYear();
      calMonth = now.getMonth();

      renderAll();
      renderNotesGrid();
      await syncAll(false);
    }

    async function syncAll(showMsg = true) {
      if (!cfg) return;
      if (showMsg) setStatus('Syncing...');
      try {
        await syncTasksOnly();
        await syncNotesListOnly();
        setStatus('Synced ✓');
      } catch (e) {
        setStatus(`Sync error: ${e.message}`);
      }
    }

    async function syncTasksOnly() {
      const file = await ghFetch(`contents/${TASKS_FILE}?ref=${cfg.branch}&t=${Date.now()}`, { allow404: true });
      if (file) {
        tasksSha = file.sha;
        tasks = JSON.parse(fromBase64(file.content) || '[]');
        localStorage.setItem(TASKS_CACHE, JSON.stringify(tasks));
        renderAll();
      }
    }

    async function pushTasksToGitHub() {
      localStorage.setItem(TASKS_CACHE, JSON.stringify(tasks));
      renderAll();
      if (!cfg) return;
      setStatus('Saving tasks...');
      try {
        if (!tasksSha) {
          const existing = await ghFetch(`contents/${TASKS_FILE}?ref=${cfg.branch}&t=${Date.now()}`, { allow404: true });
          if (existing) tasksSha = existing.sha;
        }
        const body = {
          message: 'Update tasks.json',
          content: toBase64(JSON.stringify(tasks, null, 2)),
          branch: cfg.branch
        };
        if (tasksSha) body.sha = tasksSha;
        const res = await ghFetch(`contents/${TASKS_FILE}`, { method: 'PUT', body: JSON.stringify(body) });
        tasksSha = res.content.sha;
        setStatus('Saved ✓');
      } catch (e) {
        tasksSha = null;
        setStatus(`Save issue: ${e.message}`);
      }
    }

    function addTask(e) {
      e.preventDefault();
      const title = document.getElementById('task-title').value.trim();
      const category = (document.getElementById('task-category').value || 'General').trim();
      const dueDate = document.getElementById('task-date').value || todayISO();
      if (!title) return;
      tasks.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        title, category, dueDate, done: false
      });
      document.getElementById('task-title').value = '';
      pushTasksToGitHub();
    }

    function addTaskFromCal(e) {
      e.preventDefault();
      const title = document.getElementById('cal-task-title').value.trim();
      const category = (document.getElementById('cal-task-cat').value || 'General').trim();
      if (!title) return;
      tasks.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        title, category, dueDate: selectedDateStr, done: false
      });
      document.getElementById('cal-task-title').value = '';
      pushTasksToGitHub();
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
      pushTasksToGitHub();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      pushTasksToGitHub();
    }

    function clearCompleted() {
      tasks = tasks.filter(t => !t.done);
      pushTasksToGitHub();
    }

    function renderTaskItem(t) {
      return `
        <div class="task-item ${t.done ? 'completed' : ''}">
          <div class="task-left">
            <button class="check-btn ${t.done ? 'done' : ''}" onclick="toggleTask('${t.id}')" title="Toggle complete">
              ${t.done ? '✓' : ''}
            </button>
            <div>
              <div class="task-title">${escapeHtml(t.title)}</div>
              <div class="task-meta">
                <span class="pill cat">${escapeHtml(t.category || 'General')}</span>
                <span class="pill">${t.dueDate || ''}</span>
                ${formatDaysPill(t.dueDate, t.done)}
              </div>
            </div>
          </div>
          <button class="del-btn" onclick="deleteTask('${t.id}')" title="Delete">✕</button>
        </div>
      `;
    }

    function renderAll() {
      const remaining = tasks
        .filter(t => !t.done)
        .sort((a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999'));
      const completed = tasks.filter(t => t.done);
      const soonCount = remaining.filter(t => {
        const d = daysLeft(t.dueDate);
        return d !== null && d <= 3;
      }).length;

      document.getElementById('stat-left').textContent = remaining.length;
      document.getElementById('stat-soon').textContent = soonCount;
      document.getElementById('stat-done').textContent = completed.length;

      document.getElementById('remaining-count').textContent = `${remaining.length} left`;
      document.getElementById('remaining-list').innerHTML = remaining.length
        ? remaining.map(renderTaskItem).join('')
        : `<div class="empty-state">All caught up. Enjoy the calm.</div>`;

      document.getElementById('completed-list').innerHTML = completed.length
        ? completed.map(renderTaskItem).join('')
        : `<div class="empty-state">No completed tasks yet.</div>`;

      renderCalendar();
    }

    function switchTab(tab) {
      ['dash', 'cal', 'notes'].forEach(name => {
        document.getElementById(`view-${name}`).style.display = name === tab ? 'block' : 'none';
        document.getElementById(`tab-${name}`).classList.toggle('active', name === tab);
      });
      if (tab === 'notes') {
        backToNotesList();
        syncNotesListOnly().catch(() => {});
      }
    }

    function changeMonth(delta) {
      calMonth += delta;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendar();
    }

    function renderCalendar() {
      const grid = document.getElementById('cal-grid');
      if (!grid) return;

      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      document.getElementById('cal-month-label').textContent = `${monthNames[calMonth]} ${calYear}`;

      const firstDay = new Date(calYear, calMonth, 1).getDay();
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

      let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');
      for (let i = 0; i < firstDay; i++) html += `<div class="cal-day empty"></div>`;

      const today = todayISO();
      for (let day = 1; day <= daysInMonth; day++) {
        const mm = String(calMonth + 1).padStart(2, '0');
        const dd = String(day).padStart(2, '0');
        const iso = `${calYear}-${mm}-${dd}`;
        const dayTasks = tasks.filter(t => t.dueDate === iso);

        const maxChips = 3;
        const visibleChips = dayTasks.slice(0, maxChips).map(t =>
          `<div class="cal-chip ${t.done ? 'done' : ''}" title="${escapeHtml(t.title)}">${escapeHtml(t.title)}</div>`
        ).join('');
        const extraCount = dayTasks.length - maxChips;
        const moreLabel = extraCount > 0 ? `<div class="cal-more">+${extraCount} more</div>` : '';

        html += `
          <div class="cal-day ${iso === today ? 'today' : ''} ${iso === selectedDateStr ? 'selected' : ''}" onclick="selectDay('${iso}')">
            <div class="cal-num">${day}</div>
            <div class="cal-chips">${visibleChips}${moreLabel}</div>
          </div>
        `;
      }

      grid.innerHTML = html;
      renderSelectedDay();
    }

    function selectDay(iso) {
      selectedDateStr = iso;
      renderCalendar();
    }

    function renderSelectedDay() {
      document.getElementById('selected-day-title').textContent = `Work on ${selectedDateStr}`;
      const diff = daysLeft(selectedDateStr);
      const pill = document.getElementById('selected-day-countdown');
      if (diff === 0) pill.textContent = 'Today';
      else if (diff > 0) pill.textContent = `${diff} days from today`;
      else pill.textContent = `${Math.abs(diff)} days ago`;

      const dayTasks = tasks.filter(t => t.dueDate === selectedDateStr);
      document.getElementById('cal-day-tasks').innerHTML = dayTasks.length
        ? dayTasks.map(renderTaskItem).join('')
        : `<div class="empty-state">Nothing scheduled for this day.</div>`;
    }

    // --- GOOGLE KEEP STYLE NOTES ---
    async function syncNotesListOnly() {
      const tree = await ghFetch(`git/trees/${cfg.branch}?recursive=1`);
      const mdFiles = (tree.tree || []).filter(f => f.type === 'blob' && f.path.endsWith('.md') && f.path !== TASKS_FILE);

      // Keep cached content if sha matches, fetch content for new/changed notes
      const nextStore = {};
      for (const f of mdFiles) {
        if (notesStore[f.path] && notesStore[f.path].sha === f.sha && typeof notesStore[f.path].content === 'string') {
          nextStore[f.path] = notesStore[f.path];
        } else {
          const data = await ghFetch(`contents/${f.path}?ref=${cfg.branch}&t=${Date.now()}`);
          nextStore[f.path] = { content: fromBase64(data.content), sha: data.sha };
        }
      }
      notesStore = nextStore;
      localStorage.setItem(NOTES_CACHE, JSON.stringify(notesStore));
      renderNotesGrid();
    }

    function renderNotesGrid() {
      const q = (document.getElementById('note-search')?.value || '').toLowerCase().trim();
      const paths = Object.keys(notesStore).filter(p => {
        if (!q) return true;
        return p.toLowerCase().includes(q) || (notesStore[p].content || '').toLowerCase().includes(q);
      });

      const grid = document.getElementById('notes-grid');
      if (!grid) return;

      if (!paths.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No notes yet. Click "+ New Note" to start.</div>`;
        return;
      }

      grid.innerHTML = paths.map(path => {
        const text = notesStore[path].content || '';
        const lines = text.split('\n').slice(0, 7);
        const previewHtml = lines.map(line => {
          const matchDone = line.match(/^\s*-\s*\[[xX]\]\s*(.*)$/);
          const matchOpen = line.match(/^\s*-\s*\[\s*\]\s*(.*)$/);
          if (matchDone) return `<div class="keep-checklist-item checked">☑ <span>${escapeHtml(matchDone[1])}</span></div>`;
          if (matchOpen) return `<div class="keep-checklist-item">☐ <span>${escapeHtml(matchOpen[1])}</span></div>`;
          return `<div>${escapeHtml(line)}</div>`;
        }).join('');

        return `
          <div class="keep-card" onclick="openNoteEditor('${escapeAttr(path)}')">
            <div>
              <div class="keep-title">${escapeHtml(path.replace(/\.md$/i, ''))}</div>
              <div class="keep-preview">${previewHtml || '<span style="opacity:0.5;">Empty note</span>'}</div>
            </div>
            <div class="keep-footer" onclick="event.stopPropagation()">
              <span class="pill">${escapeHtml(path)}</span>
              <button class="btn-danger btn-sm" onclick="deleteNoteByPath('${escapeAttr(path)}')">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function backToNotesList() {
      activeNotePath = null;
      document.getElementById('note-detail-view').style.display = 'none';
      document.getElementById('notes-list-view').style.display = 'block';
      renderNotesGrid();
    }

    function openNoteEditor(path) {
      activeNotePath = path;
      const item = notesStore[path] || { content: '', sha: null };
      document.getElementById('notes-list-view').style.display = 'none';
      document.getElementById('note-detail-view').style.display = 'block';
      document.getElementById('active-note-name').textContent = path;
      document.getElementById('note-editor').value = item.content || '';
      renderNoteChecklist();
    }

    function addCheckboxToNote() {
      const label = prompt('Checkbox item text:');
      if (!label) return;
      const ta = document.getElementById('note-editor');
      const prefix = ta.value && !ta.value.endsWith('\n') ? '\n' : '';
      ta.value = `${ta.value}${prefix}- [ ] ${label.trim()}`;
      renderNoteChecklist();
    }

    function renderNoteChecklist() {
      const panel = document.getElementById('note-checklist-panel');
      const lines = document.getElementById('note-editor').value.split('\n');
      const checkIndices = [];
      lines.forEach((line, idx) => {
        if (/^\s*-\s*\[[ xX]\]\s*/.test(line)) checkIndices.push(idx);
      });

      if (!checkIndices.length) {
        panel.style.display = 'none';
        panel.innerHTML = '';
        return;
      }

      panel.style.display = 'flex';
      panel.innerHTML = checkIndices.map(idx => {
        const line = lines[idx];
        const isChecked = /^\s*-\s*\[[xX]\]/.test(line);
        const text = line.replace(/^\s*-\s*\[[ xX]\]\s*/, '');
        return `
          <div class="check-row">
            <label>
              <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleNoteCheckboxLine(${idx}, this.checked)" />
              <span class="${isChecked ? 'done-text' : ''}">${escapeHtml(text)}</span>
            </label>
          </div>
        `;
      }).join('');
    }

    function toggleNoteCheckboxLine(lineIdx, checked) {
      const ta = document.getElementById('note-editor');
      const lines = ta.value.split('\n');
      lines[lineIdx] = lines[lineIdx].replace(/^\s*-\s*\[[ xX]\]/, checked ? '- [x]' : '- [ ]');
      ta.value = lines.join('\n');
      renderNoteChecklist();
    }

    async function saveCurrentNote() {
      if (!activeNotePath) return;
      const content = document.getElementById('note-editor').value;
      setStatus(`Saving ${activeNotePath}...`);
      try {
        let sha = notesStore[activeNotePath]?.sha || null;
        if (!sha) {
          const existing = await ghFetch(`contents/${activeNotePath}?ref=${cfg.branch}&t=${Date.now()}`, { allow404: true });
          if (existing) sha = existing.sha;
        }
        const body = {
          message: `Update ${activeNotePath}`,
          content: toBase64(content),
          branch: cfg.branch
        };
        if (sha) body.sha = sha;

        const res = await ghFetch(`contents/${activeNotePath}`, { method: 'PUT', body: JSON.stringify(body) });
        notesStore[activeNotePath] = { content, sha: res.content.sha };
        localStorage.setItem(NOTES_CACHE, JSON.stringify(notesStore));
        setStatus(`Saved ${activeNotePath} ✓`);
      } catch (e) {
        setStatus(`Save error: ${e.message}`);
      }
    }

    async function createNewNoteFlow() {
      const rawName = prompt('Note title or filename (e.g. shopping-list):');
      if (!rawName) return;
      const clean = rawName.trim().replace(/\.md$/i, '');
      if (!clean) return;
      const path = `${clean}.md`;
      setStatus(`Creating ${path}...`);
      try {
        const res = await ghFetch(`contents/${path}`, {
          method: 'PUT',
          body: JSON.stringify({
            message: `Create ${path}`,
            content: toBase64(`# ${clean}\n- [ ] `),
            branch: cfg.branch
          })
        });
        notesStore[path] = { content: `# ${clean}\n- [ ] `, sha: res.content.sha };
        localStorage.setItem(NOTES_CACHE, JSON.stringify(notesStore));
        setStatus(`Created ${path} ✓`);
        openNoteEditor(path);
      } catch (e) {
        setStatus(`Create error: ${e.message}`);
      }
    }

    async function deleteNoteByPath(path) {
      if (!confirm(`Delete "${path}" from GitHub?`)) return;
      setStatus(`Deleting ${path}...`);
      try {
        let sha = notesStore[path]?.sha;
        if (!sha) {
          const existing = await ghFetch(`contents/${path}?ref=${cfg.branch}&t=${Date.now()}`, { allow404: true });
          sha = existing?.sha;
        }
        if (!sha) throw new Error('File SHA not found');
        await ghFetch(`contents/${path}`, {
          method: 'DELETE',
          body: JSON.stringify({ message: `Delete ${path}`, sha, branch: cfg.branch })
        });
        delete notesStore[path];
        localStorage.setItem(NOTES_CACHE, JSON.stringify(notesStore));
        if (activeNotePath === path) backToNotesList();
        else renderNotesGrid();
        setStatus(`Deleted ${path} ✓`);
      } catch (e) {
        setStatus(`Delete error: ${e.message}`);
      }
    }

    async function deleteCurrentNote() {
      if (!activeNotePath) return;
      await deleteNoteByPath(activeNotePath);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    function escapeAttr(str) {
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    initTheme();
    if (cfg) {
      startApp();
    } else {
      document.getElementById('auth-card').style.display = 'block';
    }
  </script>
</body>
</html>
